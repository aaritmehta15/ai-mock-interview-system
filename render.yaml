services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Web Service: FastAPI REST API (Blueprints, Token Dispenser, Dossier Evaluation)
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: daazling-interview-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false          # Configured in Render Dashboard
      - key: GEMINI_API_KEY
        sync: false          # Configured in Render Dashboard
      - key: LIVEKIT_URL
        sync: false          # e.g., wss://your-project.livekit.cloud
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false          # Paste raw service account JSON string or leave empty for in-memory fallback
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO

  # ─────────────────────────────────────────────────────────────────────────────
  # Worker Service: LiveKit Real-Time Python Voice Agent
  # Handles real-time WebRTC audio streaming, Silero VAD, and Gemini Multimodal
  # ─────────────────────────────────────────────────────────────────────────────
  - type: worker
    name: daazling-livekit-worker
    env: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python agent.py start
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
